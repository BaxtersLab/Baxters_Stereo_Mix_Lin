[workspace]
resolver = "2"
members = [
    "crates/bsm-core",
    "crates/bsm-audio",
    "crates/bsm-encode",
    "crates/bsm-ui",
    "crates/bsm-ipc",
    "crates/bsm-hrt",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# UI
eframe = "0.29"
egui = "0.29"

# Error handling
thiserror = "2"
anyhow = "1"
