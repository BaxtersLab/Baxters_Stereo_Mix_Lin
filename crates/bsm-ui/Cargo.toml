[package]
name = "bsm-ui"
version.workspace = true
edition = "2021"
build = "build.rs"

[[bin]]
name = "bsm-ui"
path = "src/main.rs"

[lib]
name = "bsm_ui"
path = "src/lib.rs"

[dependencies]
bsm-core = { path = "../bsm-core" }
bsm-audio = { path = "../bsm-audio" }
bsm-encode = { path = "../bsm-encode" }
bsm-ipc = { path = "../bsm-ipc" }
bsm-hrt = { path = "../bsm-hrt" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
tempfile = "3"
rfd = "0.9"
dirs-next = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"